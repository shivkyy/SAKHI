# Render Blueprint Specification for SAKHI Live Tracking Service
services:
  - type: web
    name: sakhi-live-tracking
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: echo "Zero dependency build complete"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_MINUTES
        value: "120"
      - key: DATA_PATH
        value: "/tmp/sakhi-sessions.json"
